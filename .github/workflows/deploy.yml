name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # base-href must match the repo name, otherwise JS/CSS files 404
      - run: npx ng build --configuration production --base-href /gradski-prevoz-stara-pazova/

      # Lets deep links like /linija/5 work after a page refresh
      - run: cp dist/stara-pazova-gradski-prevoz/browser/index.html dist/stara-pazova-gradski-prevoz/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/stara-pazova-gradski-prevoz/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
