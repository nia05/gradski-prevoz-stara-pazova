<nav aria-label="Putanja">
    <ol class="breadcrumb">
        @for (breadcrumbLink of links(); track breadcrumbLink.name) {
            <li class="breadcrumb__item">
                @if (!$first) {
                    <img [src]="iconPath.BreadcrumbArrow" alt="">
                }
                @if ($last) {
                    <span class="breadcrumb__current" aria-current="page">{{ breadcrumbLink.name }}</span>
                } @else {
                    <a class="breadcrumb__link" [routerLink]="breadcrumbLink.link">{{ breadcrumbLink.name }}</a>
                }
            </li>
        }
    </ol>
</nav>
