<a class="bus-stop-item" [routerLink]="['/', busLinePath, busLineNumber(), busStopId()]">
    <span class="bus-stop-item__name">{{ busStopName() }}</span>
    @if (isTownVisible()) {
        <span class="bus-stop-item__town">{{ busStopTown() }}</span>
    }
    <img class="bus-stop-item__arrow" src="icons/arrow-next.svg" alt="">
</a>
