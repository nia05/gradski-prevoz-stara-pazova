<section class="bus-stop-list">
    <h2 class="bus-stop-list__title">Lista stajališta</h2>

    <div class="bus-stop-list__columns">
        @for (busStopColumn of busStopColumns(); track $index) {
            <ul class="bus-stop-list__items">
                @for (busStop of busStopColumn; track $index) {
                    <li>
                        <app-bus-stop-item
                            [busLineNumber]="busLineNumber()"
                            [busStopId]="busStop.id"
                            [busStopName]="busStop.name"
                            [busStopTown]="busStop.town"
                        />
                    </li>
                }
            </ul>
        }
    </div>
</section>
