@if (busLine(); as busLine) {
    @let busStops = isReturnDirection() ? busLine.directions[1].busStops : busLine.directions[0].busStops;

    <app-line-header
        [busLine]="busLine"
        [isReturnDirection]="isReturnDirection()"
        (directionChange)="changeDirection()"
    />

    <app-bus-stop-list
        [busLineNumber]="busLine.number"
        [busStops]="busStops"
    />
}
