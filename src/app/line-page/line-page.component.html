@if (busLine(); as busLine) {
    @let direction = isReturnDirection() ? busLine.directions[1] : busLine.directions[0];

    <app-line-header
        [busLine]="busLine"
        [isReturnDirection]="isReturnDirection()"
        [skippedBusStopNames]="getSkippedBusStopNames(direction)"
        [routeChangeNewsId]="direction.routeChangeNewsId"
        (directionChange)="changeDirection()"
    />

    <app-bus-stop-list
        [busLineNumber]="busLine.number"
        [busStops]="direction.busStops"
        [skippedBusStopIds]="direction.skippedBusStopIds"
    />
}
